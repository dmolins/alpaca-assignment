version: 2

models:
  - name: mart_daily_hourly_performance
    description: >
      One row per (date, hour): buy/sell price, that day's hourly return,
      the compounded equity curve value and running max for that hour's
      series, and the resulting drawdown. Not pre-aggregated to hour-of-day
      — see the model SQL for why keeping this grain matters. The two
      questions the prompt asks are answered by rolling this table up in
      analyses/answer_biggest_return_hour.sql and
      analyses/answer_lowest_drawdown_hour.sql.
    columns:
      # date, hour, buy_price, sell_price, hourly_return, equity and running_max_equity
      # all pass straight through from upstream intermediate models with no further
      # transformation — each is already tested once, at the model that computes it, so
      # they aren't retested here. drawdown is first computed in this model.
      - name: drawdown
        data_tests:
          - not_null
